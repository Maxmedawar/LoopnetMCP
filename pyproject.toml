[project]
name = "cre-mcp"
version = "0.1.0"
description = "MCP server for searching Loopnet commercial real estate listings"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "curl_cffi>=0.7,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "nodriver>=0.48,<1",
    "clerk-backend-api>=6,<7",
]

[project.scripts]
medawarcre-postgres = "cre_mcp.postgres.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]
# Document Truth Engine and workbook-forensics parsers. The core scraper can
# omit these, while the hosted image installs this extra because its complete
# server registry imports the workbook-forensics tool surface.
truth = [
    "pdfplumber>=0.11,<1",
    "openpyxl>=3.1,<4",
    "pypdf>=6,<7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cre_mcp.access" = ["capability_matrix.json", "data/*.gz", "data/*.md"]
"cre_mcp.postgres" = ["sql/*.sql"]
"cre_mcp.source_rights" = ["registry.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
